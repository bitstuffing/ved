name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Shell checks and CLI tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run validation suite
        run: make check
